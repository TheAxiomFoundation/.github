name: Test shared workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/test_legacy_oracle_coverage_workflow.py"
      - "scripts/test_validate_rulespec_workflow.py"
      - "scripts/test_notary_guard_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/test_legacy_oracle_coverage_workflow.py"
      - "scripts/test_validate_rulespec_workflow.py"
      - "scripts/test_notary_guard_workflow.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install workflow test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Test validation-waiver bootstrap authorization
        run: python scripts/test_validate_rulespec_workflow.py
      - name: Test legacy oracle coverage overlay
        run: python scripts/test_legacy_oracle_coverage_workflow.py
