name: Test shared workflows

# No path filters: this job is the check that protects main, and GitHub leaves
# a required check pending, blocking the merge, when path filtering skips its
# workflow. Every pull request and every push to main runs it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install workflow test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Test validation-waiver bootstrap authorization
        run: python scripts/test_validate_rulespec_workflow.py
      - name: Test legacy oracle coverage overlay
        run: python scripts/test_legacy_oracle_coverage_workflow.py
      - name: Test protected composer verification
        run: python scripts/test_composer_verification_workflow.py
      - name: Test external dependency layout
        run: python scripts/test_external_dependency_layout.py
      - name: Test ruleset encoder guard
        run: python tests/test_encoder_guard_workflow.py
      - name: Test authenticated dependency integrity
        run: python scripts/test_dependency_integrity_workflow.py
      - name: Test legacy encoder waiver audit compatibility
        run: python scripts/test_legacy_encoder_waiver_workflow.py
      - name: Test pin bump manifest revalidation
        run: python scripts/test_pin_bump_manifest_workflow.py
